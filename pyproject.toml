[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decisionpack"
version = "0.1.0"
description = "Hypothesis-driven analysis of a metric gap: driver bridge, segment scan, issue tree, sized recommendations, memo and deck."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Pranjal Sailwal" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "pyyaml>=6",
  "pydantic>=2.5",
  "python-pptx>=0.6.23",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-asyncio>=0.23",
  "hypothesis>=6.100",
  "statsmodels>=0.14",
  "httpx>=0.27",
  "mypy>=1.10",
  "ruff>=0.5",
  "pandas-stubs",
  "types-PyYAML",
]

[project.scripts]
decisionpack = "decisionpack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
files = ["src/decisionpack"]

[[tool.mypy.overrides]]
module = ["scipy.*", "pptx.*", "statsmodels.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# python-pptx ships no type information, so calls into it are untyped by construction.
module = ["decisionpack.report.deck"]
disallow_untyped_calls = false
disallow_any_unimported = false

[tool.coverage.run]
source = ["src/decisionpack"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
