<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 446" width="912" height="446" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title id="t">Hypothesis tree</title>
<desc id="d">Each box is a hypothesis marked supported, refuted or untested.</desc>
<rect width="912" height="446" fill="#ffffff"/>
<text x="20" y="28" font-size="17" font-weight="600" fill="#1f2933">Hypothesis tree</text>
<text x="20" y="46" font-size="12" fill="#52606d">Green: supported. Grey: refuted. Dashed white: untested.</text>
