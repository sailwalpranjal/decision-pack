<rect x="20.0" y="171.7" width="250" height="78" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="30.0" y="188.7" font-size="10" font-weight="700" fill="#9ca3af">UNTESTED</text>
<text x="30.0" y="204.7" font-size="11" fill="#1f2933">Cost per approved conversion is higher</text>
<text x="30.0" y="217.7" font-size="11" fill="#1f2933">in campaign 1178 than in campaign 936.</text>
<rect x="314.0" y="62.0" width="250" height="78" rx="6" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
<text x="324.0" y="79.0" font-size="10" font-weight="700" fill="#6b7280">REFUTED</text>
<text x="324.0" y="95.0" font-size="11" fill="#1f2933">Media got more expensive, so each</text>
<text x="324.0" y="108.0" font-size="11" fill="#1f2933">impression costs more.</text>
<rect x="314.0" y="156.0" width="250" height="78" rx="6" fill="#d1fae5" stroke="#0f766e" stroke-width="1.5"/>
<text x="324.0" y="173.0" font-size="10" font-weight="700" fill="#0f766e">SUPPORTED</text>
<text x="324.0" y="189.0" font-size="11" fill="#1f2933">The ads attract fewer clicks per</text>
<text x="324.0" y="202.0" font-size="11" fill="#1f2933">impression.</text>
<rect x="314.0" y="297.0" width="250" height="78" rx="6" fill="#d1fae5" stroke="#0f766e" stroke-width="1.5"/>
<text x="324.0" y="314.0" font-size="10" font-weight="700" fill="#0f766e">SUPPORTED</text>
<text x="324.0" y="330.0" font-size="11" fill="#1f2933">Clicks turn into approved conversions at</text>
<text x="324.0" y="343.0" font-size="11" fill="#1f2933">a much lower rate.</text>
<rect x="608.0" y="250.0" width="250" height="78" rx="6" fill="#d1fae5" stroke="#0f766e" stroke-width="1.5"/>
<text x="618.0" y="267.0" font-size="10" font-weight="700" fill="#0f766e">SUPPORTED</text>
<text x="618.0" y="283.0" font-size="11" fill="#1f2933">Fewer clicks turn into an enquiry.</text>
<rect x="608.0" y="344.0" width="250" height="78" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
